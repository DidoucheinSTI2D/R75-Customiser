name: macOS build

# Builds the macOS app (universal .dmg, Intel + Apple Silicon) on a GitHub macOS runner.
# On a published release the .dmg is attached to it; a manual run keeps it as a workflow artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
      - name: Smoke test (signature + app starts and stays up)
        run: |
          APP="dist/mac-universal/R75 Customiser.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          "$APP/Contents/MacOS/R75 Customiser" > app.log 2>&1 &
          PID=$!
          sleep 15
          kill -0 $PID || { cat app.log; echo "app exited early"; exit 1; }
          kill $PID
          cat app.log
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg
      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
